appId: com.piwork.desktop
productName: Pi Work
executableName: pi-work
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/@earendil-works/**
extraResources:
  - from: build/pi-runtime/agent-service.js
    to: pi-runtime/agent-service.js
  - from: build/pi-runtime/chunks
    to: pi-runtime/chunks
  - from: build/pi-runtime/package.json
    to: pi-runtime/package.json
  - from: build/pi-runtime/node_modules
    to: pi-runtime/node_modules
    filter:
      - "**/*"
mac:
  icon: icons/generated/mac/icon.icns
  target:
    - dmg
    - zip
win:
  icon: icons/generated/windows/icon.ico
  target:
    - nsis
linux:
  icon: icons/generated/linux
  target:
    - AppImage
    - tar.gz
