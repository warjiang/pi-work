name: Package desktop

on:
  workflow_dispatch:
  pull_request:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac dmg zip
          - os: windows-latest
            target: --win nsis
          - os: ubuntu-latest
            target: --linux AppImage tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:pi
      - run: pnpm --filter @pi-work/desktop exec electron-builder ${{ matrix.target }} --publish never
      - if: runner.os == 'macOS'
        run: pnpm --filter @pi-work/desktop verify:pi-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: pi-work-${{ runner.os }}
          path: apps/desktop/release/
