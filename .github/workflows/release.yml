name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without signing, notarizing, or publishing
        required: true
        default: true
        type: boolean
      publish:
        description: Create the GitHub Release after signed verification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run release checks
        run: pnpm check
      - name: Build unsigned macOS artifacts
        run: pnpm --filter @pi-work/desktop ci:package:mac:dry-run
      - name: Verify dry-run artifacts
        shell: bash
        run: |
          app_path="$(find apps/desktop/release -maxdepth 2 -type d -name '*.app' -print -quit)"
          dmg_path="$(find apps/desktop/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          zip_path="$(find apps/desktop/release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$app_path"
          test -n "$dmg_path"
          test -n "$zip_path"
          test -x "$app_path/Contents/MacOS/pi-work"
          test "$(plutil -extract CFBundleIdentifier raw "$app_path/Contents/Info.plist")" = "com.piwork.desktop"
          test "$(plutil -extract CFBundleShortVersionString raw "$app_path/Contents/Info.plist")" = "$(node -p "require('./apps/desktop/package.json').version")"
          hdiutil verify "$dmg_path"
          unzip -tq "$zip_path"
          pnpm --filter @pi-work/desktop verify:pi-runtime

  release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run release checks
        run: pnpm check
      - name: Validate release version
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$version" >&2
            exit 1
          fi
      - name: Validate release secrets
        shell: bash
        env:
          APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_CODESIGN_CERT_P12_BASE64"
          test -n "$APPLE_CODESIGN_CERT_PASSWORD"
          test -n "$APPLE_API_KEY_P8_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"
          test -n "$APPLE_TEAM_ID"
      - name: Prepare App Store Connect API key
        run: |
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      - name: Build, sign, and notarize macOS release
        run: pnpm --filter @pi-work/desktop ci:package:mac
        env:
          CSC_LINK: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify signed app and notarization ticket
        shell: bash
        run: |
          app_path="$(find apps/desktop/release -maxdepth 2 -type d -name '*.app' -print -quit)"
          dmg_path="$(find apps/desktop/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          zip_path="$(find apps/desktop/release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$app_path"
          test -n "$dmg_path"
          test -n "$zip_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          hdiutil verify "$dmg_path"
          unzip -tq "$zip_path"
          pnpm --filter @pi-work/desktop verify:pi-runtime
      - name: Upload signed dry-run artifacts
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: pi-work-signed-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
      - name: Resolve release tag
        if: github.event_name == 'push' || inputs.publish
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            version="$(node -p "require('./apps/desktop/package.json').version")"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub release
        if: github.event_name == 'push' || inputs.publish
        run: gh release create "${{ steps.release.outputs.tag }}" apps/desktop/release/*.{dmg,zip} --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
