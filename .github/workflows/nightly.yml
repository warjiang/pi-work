name: Nightly runtime verification

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @pi-work/desktop build
      - run: pnpm prepare:pi
      - run: pnpm --filter @pi-work/desktop exec electron-builder --dir --publish never
      - run: pnpm --filter @pi-work/desktop verify:pi-runtime
